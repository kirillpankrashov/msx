<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mini Lampa Clone</title>
  <script src="https://msx.benzac.de/msx/msx.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #141414; color: #fff; font-family: sans-serif; overflow: hidden; padding: 40px; }
    h1 { margin-bottom: 20px; color: #e50914; }
    
    .grid { display: flex; gap: 20px; overflow-x: auto; padding: 10px 0; }
    .card {
      min-width: 180px; width: 180px; background: #222; border-radius: 8px;
      overflow: hidden; border: 3px solid transparent; transition: 0.2s; cursor: pointer;
    }
    .card img { width: 100%; height: 260px; object-fit: cover; display: block; }
    .card-title { padding: 10px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Эффект фокуса с пульта */
    .card.focusable:focus, .card.focused {
      border-color: #e50914;
      transform: scale(1.08);
      outline: none;
    }

    /* Модальное окно плеера */
    #player-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 99;
    }
    video { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <h1>Мой Кинотеатр понятно</h1>
  <div class="grid" id="movies-grid"></div>

  <!-- Видеоплеер -->
  <div id="player-modal">
    <video id="video-player" controls autoplay src=""></video>
  </div>

  <script>
    // Публичный API ключ TMDB для получения списка трендов
    const TMDB_API_KEY = '3177e06ddb70b8bb5c97a0c626faa169'; 
    const GRID = document.getElementById('movies-grid');
    let focusIndex = 0;

    // 1. Получение трендов кино из TMDB
    async function loadMovies() {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_API_KEY}&language=ru-RU`);
        const data = await res.json();
        renderCards(data.results);
      } catch (e) {
        GRID.innerHTML = '<p>Ошибка загрузки данных</p>';
      }
    }

    // 2. Отрисовка карточек
    function renderCards(movies) {
      GRID.innerHTML = movies.map((m, i) => `
        <div class="card focusable" tabindex="0" data-video="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
          <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" alt="${m.title}" />
          <div class="card-title">${m.title}</div>
        </div>
      `).join('');

      // Ставим фокус на первый элемент
      const cards = document.querySelectorAll('.card');
      if (cards.length) cards[0].focus();
    }

    // 3. Обработка кнопок пульта (Пространственный фокус)
    document.addEventListener('keydown', (e) => {
      const cards = Array.from(document.querySelectorAll('.card'));
      if (!cards.length) return;

      if (e.key === 'ArrowRight') {
        focusIndex = Math.min(focusIndex + 1, cards.length - 1);
        cards[focusIndex].focus();
      } else if (e.key === 'ArrowLeft') {
        focusIndex = Math.max(focusIndex - 1, 0);
        cards[focusIndex].focus();
      } else if (e.key === 'Enter') {
        const videoUrl = cards[focusIndex].dataset.video;
        openPlayer(videoUrl);
      } else if (e.key === 'Backspace' || e.key === 'Escape') {
        closePlayer();
      }
    });

    // 4. Логика плеера
    function openPlayer(url) {
      const modal = document.getElementById('player-modal');
      const player = document.getElementById('video-player');
      player.src = url;
      modal.style.display = 'block';
      player.play();
    }

    function closePlayer() {
      const modal = document.getElementById('player-modal');
      const player = document.getElementById('video-player');
      player.pause();
      modal.style.display = 'none';
      player.src = '';
    }

    loadMovies();
  </script>
</body>
</html>
